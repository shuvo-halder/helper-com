server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html;
    index index.html;

    # Optional custom 404 error page
    # error_page 404 /404.html;
    # location = /404.html {
    #     internal;
    # }

    # Let's Encrypt / Certbot ACME webroot challenge (must precede hidden-file block)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Welcome landing page
    location = / {
        try_files /index.html =404;
    }

    # Lightweight visitor diagnostics endpoints
    location = /api/ip {
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 $remote_addr;
    }

    location = /api/ping {
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "pong";
    }

    # Block access to hidden files and directories (.git, .env, .htaccess)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Return 404 for all other unmapped routes
    location / {
        return 404;
    }
}
