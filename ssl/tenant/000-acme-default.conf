<VirtualHost *:80>
    ServerName acme-default.foodbazaar.fr
    DocumentRoot /var/www/acme

    <Directory /var/www/acme>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>
